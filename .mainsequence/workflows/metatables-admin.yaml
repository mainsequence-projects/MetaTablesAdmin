api_version: "2.3.0"
name: metatables-admin
# Production deploys from main; development deploys from
# metatables-admin-development.yaml.
scope:
  environments: [production]
resources:
  - key: metatables-admin
    kind: static_site
    spec:
      name: MetaTables Admin
      root_directory: ""
      framework: vite
      node_version: "24"
      output_directory: dist
      routing_mode: spa
      spa_entry_file: /index.html
      # Names the production MetaTables FastAPI; Django resolves its UID at every build.
      build_environment:
        VITE_METATABLES_RESOURCE_RELEASE_UID:
          resource_release:
            repository: MetaTables
            key: metatables
        # The production MetaTables Analyst and its Environment, for the assistant rail. A
        # build value cannot name an Agent yet (tdag-django#911), so these are UIDs.
        VITE_METATABLES_AGENT_UID: fd7575a1-f8e2-402e-a263-10aa3f04a09a
        VITE_METATABLES_ENVIRONMENT_UID: 18595d12-f92a-4960-84cd-0c6798a1ad25
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      navigation_link:
        label: MetaTables
        icon_key: app-window
        icon_mask_path: public/navigation-icon.svg
        is_enabled: true
        audiences:
          organization_wide: false
          team_uids: []
          user_uids:
            - e2a4f38a-1b5f-40a3-974f-70bc8f065b3f
