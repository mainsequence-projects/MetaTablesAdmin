api_version: "2.3.0"
name: metatables-admin-development
# The development Environment's exact name.
scope:
  environments: [development]
resources:
  - key: metatables-admin
    kind: static_site
    spec:
      name: MetaTables Admin
      root_directory: ""
      framework: vite
      node_version: "24"
      output_directory: dist
      routing_mode: spa
      spa_entry_file: /index.html
      # Public release identity of the development MetaTables FastAPI, not a credential.
      build_environment:
        VITE_METATABLES_RESOURCE_RELEASE_UID: c7db3f76-5d8d-4d76-a749-f5a589210745
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      navigation_link:
        label: MetaTables
        icon_key: app-window
        icon_mask_path: public/navigation-icon.svg
        is_enabled: true
        audiences:
          organization_wide: false
          team_uids: []
          user_uids:
            - e2a4f38a-1b5f-40a3-974f-70bc8f065b3f
