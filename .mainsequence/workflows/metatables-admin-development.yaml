api_version: "2.3.0"
name: metatables-admin-development
# The development Environment's exact name.
scope:
  environments: [development]
resources:
  - key: metatables-admin
    kind: static_site
    spec:
      name: MetaTables Admin
      root_directory: ""
      framework: vite
      node_version: "24"
      output_directory: dist
      routing_mode: spa
      spa_entry_file: /index.html
      # Names the development MetaTables FastAPI; Django resolves its UID at every build.
      build_environment:
        VITE_METATABLES_RESOURCE_RELEASE_UID:
          resource_release:
            repository: MetaTables
            key: metatables
        # The development MetaTables Analyst and its Environment, for the assistant rail. A
        # build value cannot name an Agent yet (tdag-django#911), so these are UIDs.
        VITE_METATABLES_AGENT_UID: 6073b33c-f9aa-4149-8172-b284c01a06b4
        VITE_METATABLES_ENVIRONMENT_UID: 58218213-5e4e-43de-a5bd-6757f4e1c8f6
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      navigation_link:
        label: MetaTables
        icon_key: app-window
        icon_mask_path: public/navigation-icon.svg
        is_enabled: true
        audiences:
          organization_wide: false
          team_uids: []
          user_uids:
            - e2a4f38a-1b5f-40a3-974f-70bc8f065b3f
